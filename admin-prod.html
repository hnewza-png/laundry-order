<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — น้ำยา</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #f472b6; --pink-light: #fce7f3; --pink-dark: #be185d;
    --purple: #a855f7; --purple-light: #f3e8ff;
    --green: #10b981; --green-light: #d1fae5;
    --red: #ef4444; --red-light: #fee2e2;
    --blue: #3b82f6; --blue-light: #dbeafe;
    --orange: #f97316; --orange-light: #ffedd5;
    --bg: #f8fafc; --card: #ffffff; --text: #1e1b2e; --muted: #6b7280; --border: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Prompt', sans-serif; background: var(--bg); color: var(--text); }

  .header { background: linear-gradient(135deg, #1e1b2e 0%, #3b0764 100%); padding: 20px 16px; display:flex; align-items:center; gap:12px; }
  .header-icon { font-size: 28px; }
  .header h1 { color: #fff; font-size: 18px; font-weight: 700; }
  .header p  { color: rgba(255,255,255,0.5); font-size: 11px; }

  .tabs { display:flex; background:#fff; border-bottom:2px solid var(--border); position:sticky; top:0; z-index:50; }
  .tab { flex:1; padding:12px 8px; text-align:center; font-size:13px; font-weight:600; cursor:pointer; color:var(--muted); background:none; border:none; border-bottom:3px solid transparent; transition:all 0.2s; font-family:'Prompt',sans-serif; }
  .tab.active { color:var(--pink-dark); border-bottom-color:var(--pink-dark); }

  .container { max-width:480px; margin:0 auto; padding:12px 12px 80px; }

  .stats-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:16px; }
  .stat-card { background:var(--card); border-radius:14px; padding:12px 10px; text-align:center; border:1px solid var(--border); }
  .stat-num { font-size:22px; font-weight:700; }
  .stat-label { font-size:10px; color:var(--muted); margin-top:2px; }
  .stat-card.pink .stat-num   { color:var(--pink-dark); }
  .stat-card.green .stat-num  { color:var(--green); }
  .stat-card.purple .stat-num { color:var(--purple); }

  .order-card { background:var(--card); border-radius:16px; border:1.5px solid var(--border); margin-bottom:10px; overflow:hidden; transition:box-shadow 0.2s; }
  .order-card:hover { box-shadow:0 4px 16px rgba(0,0,0,0.08); }
  .order-header { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid var(--border); }
  .order-num  { font-size:14px; font-weight:700; color:var(--purple); }
  .order-name { font-size:13px; font-weight:600; margin-top:1px; }
  .order-time { font-size:10px; color:var(--muted); }

  .badge-row { display:flex; gap:6px; flex-wrap:wrap; }
  .status-badge { font-size:11px; font-weight:600; padding:4px 10px; border-radius:20px; }
  .status-badge.pending   { background:#fef3c7; color:#92400e; }
  .status-badge.paid      { background:var(--green-light); color:#065f46; }
  .status-badge.trash     { background:var(--red-light); color:#991b1b; }
  .status-badge.cash      { background:var(--orange-light); color:#9a3412; }
  .status-badge.qr        { background:var(--blue-light); color:#1e40af; }
  .status-badge.collected { background:var(--green-light); color:#065f46; }
  .status-badge.not-collected { background:#f3f4f6; color:#6b7280; }

  .order-items { padding:10px 14px; }
  .order-item-row { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); padding:3px 0; font-family:'Sarabun',sans-serif; }
  .discount-line { color:var(--green); font-weight:600; }
  .order-total-row { display:flex; justify-content:space-between; font-size:14px; font-weight:700; padding:8px 14px; border-top:1px solid var(--border); background:var(--bg); }
  .order-total-row span:last-child { color:var(--pink-dark); }

  .order-actions { display:flex; gap:6px; padding:10px 14px; border-top:1px solid var(--border); flex-wrap:wrap; }
  .action-btn { flex:1; min-width:80px; padding:8px 6px; border-radius:10px; border:none; font-size:11px; font-weight:600; font-family:'Prompt',sans-serif; cursor:pointer; transition:opacity 0.2s; text-align:center; }
  .action-btn:hover { opacity:0.85; }
  .btn-confirm     { background:var(--green-light); color:#065f46; }
  .btn-confirmed   { background:var(--green); color:#fff; }
  .btn-collect     { background:var(--orange-light); color:#9a3412; }
  .btn-collected   { background:var(--orange); color:#fff; }
  .btn-trash       { background:var(--red-light); color:#991b1b; }
  .btn-restore     { background:var(--blue-light); color:#1d4ed8; }

  .empty-state { text-align:center; padding:48px 0; color:var(--muted); }
  .empty-state .icon { font-size:48px; margin-bottom:8px; }
  .empty-state p { font-size:13px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">🔧</div>
  <div>
    <h1>Admin Panel</h1>
    <p>จัดการคำสั่งซื้อ</p>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('orders')">📋 คำสั่งซื้อ</button>
  <button class="tab" onclick="switchTab('trash')">🗑️ ถังขยะ</button>
</div>

<div class="container">

  <div id="tab-orders">
    <div class="stats-grid">
      <div class="stat-card pink">  <div class="stat-num" id="stat-total">0</div>  <div class="stat-label">ทั้งหมด</div></div>
      <div class="stat-card green"> <div class="stat-num" id="stat-paid">0</div>   <div class="stat-label">ชำระแล้ว</div></div>
      <div class="stat-card purple"><div class="stat-num" id="stat-revenue">฿0</div><div class="stat-label">ยอดรวม</div></div>
    </div>
    <div id="orders-list">
      <div class="empty-state"><div class="icon">📭</div><p>ยังไม่มีคำสั่งซื้อ</p></div>
    </div>
  </div>

  <div id="tab-trash" style="display:none">
    <div id="trash-list">
      <div class="empty-state"><div class="icon">✨</div><p>ถังขยะว่างเปล่า</p></div>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, updateDoc, onSnapshot, query, orderBy }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCHr0SZvQS_UtFG9AiXtUh-QY-Yu-WLsdw",
  authDomain: "laundry-order-prod.firebaseapp.com",
  projectId: "laundry-order-prod",
  storageBucket: "laundry-order-prod.firebasestorage.app",
  messagingSenderId: "792880986002",
  appId: "1:792880986002:web:97cf5897111b71285ff34b"
};
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

let allOrders = [];

function formatTime(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString('th-TH', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}

function renderOrderCard(o, isTrash) {
  const items = (o.items||[]).map(i =>
    `<div class="order-item-row"><span>${i.name} ×${i.qty}</span><span>฿${(i.subtotal||i.price*i.qty).toLocaleString()}</span></div>`
  ).join('');

  const discountLine = (o.discount > 0)
    ? `<div class="order-item-row discount-line"><span>🎉 ส่วนลดบริส</span><span>-฿${o.discount}</span></div>`
    : '';

  const payMethod = o.paymentMethod === 'cash' ? '💵 เงินสด' : '📱 QR Code';
  const payBadgeClass = o.paymentMethod === 'cash' ? 'cash' : 'qr';
  const collectedBadge = o.collected
    ? '<span class="status-badge collected">📦 รับของแล้ว</span>'
    : '<span class="status-badge not-collected">⏳ ยังไม่รับ</span>';

  const actions = isTrash
    ? `<button class="action-btn btn-restore" onclick="restoreOrder('${o.id}')">↩️ กู้คืน</button>`
    : `
      <button class="action-btn ${o.paid?'btn-confirmed':'btn-confirm'}" onclick="togglePaid('${o.id}',${!o.paid})">
        ${o.paid ? '✅ ชำระแล้ว' : '💳 ยืนยันชำระ'}
      </button>
      <button class="action-btn btn-trash" onclick="trashOrder('${o.id}')">🗑️</button>
    `;

  return `
    <div class="order-card">
      <div class="order-header">
        <div>
          <div class="order-num">#${o.orderNumber||'???'}</div>
          <div class="order-name">${o.customerName||'-'}</div>
          <div class="order-time">${formatTime(o.createdAt)}</div>
        </div>
        <div class="badge-row">
          <span class="status-badge ${payBadgeClass}">${payMethod}</span>
          <span class="status-badge ${isTrash?'trash':o.paid?'paid':'pending'}">
            ${isTrash ? '🗑️ ลบ' : o.paid ? '✅ ชำระแล้ว' : '⏳ รอชำระ'}
          </span>
          ${!isTrash ? '' : ''}
        </div>
      </div>
      <div class="order-items">${items}${discountLine}</div>
      <div class="order-total-row"><span>ยอดรวม</span><span>฿${(o.total||0).toLocaleString()}</span></div>
      <div class="order-actions">${actions}</div>
    </div>`;
}

function renderOrders() {
  const active = allOrders.filter(o => !o.deleted);
  const trash  = allOrders.filter(o =>  o.deleted);

  document.getElementById('orders-list').innerHTML = active.length
    ? active.map(o => renderOrderCard(o, false)).join('')
    : '<div class="empty-state"><div class="icon">📭</div><p>ยังไม่มีคำสั่งซื้อ</p></div>';

  document.getElementById('trash-list').innerHTML = trash.length
    ? trash.map(o => renderOrderCard(o, true)).join('')
    : '<div class="empty-state"><div class="icon">✨</div><p>ถังขยะว่างเปล่า</p></div>';
}

function updateStats() {
  const active  = allOrders.filter(o => !o.deleted);
  const paid    = active.filter(o => o.paid);
  const revenue = paid.reduce((s,o) => s+(o.total||0), 0);
  document.getElementById('stat-total').textContent   = active.length;
  document.getElementById('stat-paid').textContent    = paid.length;
  document.getElementById('stat-revenue').textContent = `฿${revenue.toLocaleString()}`;
}

function listenOrders() {
  const q = query(collection(db,'orders'), orderBy('createdAt','desc'));
  onSnapshot(q, snap => {
    allOrders = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    renderOrders();
    updateStats();
  });
}

window.togglePaid  = (id, paid) => updateDoc(doc(db,'orders',id), { paid, status: paid?'confirmed':'pending' });
window.trashOrder   = id => updateDoc(doc(db,'orders',id), { deleted: true });
window.restoreOrder = id => updateDoc(doc(db,'orders',id), { deleted: false });

window.switchTab = function(tab) {
  ['orders','trash'].forEach(t => {
    document.getElementById(`tab-${t}`).style.display = t===tab ? 'block' : 'none';
  });
  document.querySelectorAll('.tab').forEach((el,i) => {
    el.classList.toggle('active', ['orders','trash'][i]===tab);
  });
};

listenOrders();
</script>
</body>
</html>
